<div class="dashboard-contenedor">

  <h1>
    Dashboard Académico
  </h1>

  <p class="subtitulo">
    Estudiantes obtenidos del ETL
  </p>

  <div class="graficos">
    <!-- GRÁFICO DE BARRAS -->
    <mat-card>
      <mat-card-header>
        <mat-card-title>
          Alumnos por Facultad
        </mat-card-title>

        <mat-card-subtitle>
          Distribución de alumnos matriculados
        </mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <div class="grafico-contenedor">
          <canvas #graficoFacultades>
          </canvas>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- GRÁFICO DE DONA -->
    <mat-card>
      <mat-card-header>
        <mat-card-title>
          Estado Académico
        </mat-card-title>

        <mat-card-subtitle>
          Distribución según rendimiento académico
        </mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <div class="grafico-contenedor">
          <canvas #graficoEstado>
          </canvas>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
